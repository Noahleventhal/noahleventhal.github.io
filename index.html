<!DOCTYPE html>
<html lang="en" data-workbook-mode="visitor">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f8fafd">
  <meta name="description" content="Noah Leventhal's personal spreadsheet. A little room to think, make, and explore.">
  <title>Noah Leventhal</title>
  <meta property="og:type" content="website">
  <meta property="og:title" content="Noah Leventhal">
  <meta property="og:site_name" content="Noah Leventhal">
  <meta name="twitter:title" content="Noah Leventhal">
  <link rel="icon" href="./favicon-n.png" type="image/png" sizes="128x128">
  <link rel="stylesheet" href="./assets/fonts/fonts.css">
  <link rel="stylesheet" href="./style.css">
  <script type="module" src="./app.js"></script>
</head>
<body>
  <div id="workbook" class="workbook">
    <header class="document-header">
      <img class="document-icon" src="./workbook.svg" alt="Personal workbook" width="34" height="42">
      <div class="document-details">
        <div class="document-title-row">
          <input id="document-title" class="document-title" aria-label="Document title" readonly maxlength="100" value="Noah Leventhal" spellcheck="false">
          <button class="icon-button star-button" data-action="star" disabled aria-label="Star this workbook" title="Star this workbook"></button>
          <span id="save-status" class="save-status" role="status" aria-live="polite"></span>
        </div>
        <nav id="menu-bar" class="menu-bar" aria-label="Spreadsheet menus"></nav>
      </div>
      <div class="header-actions">
        <button class="icon-button" data-action="shortcuts" aria-label="Keyboard shortcuts" title="Keyboard shortcuts"></button>
        <span class="local-badge"><span data-icon="device"></span>Local workbook</span>
        <span class="avatar" aria-label="Noah Leventhal">N</span>
      </div>
    </header>
    <section id="toolbar" class="toolbar" aria-label="Formatting toolbar"></section>
    <section class="formula-bar" aria-label="Formula bar">
      <input id="cell-reference" class="cell-reference" value="A1" aria-label="Cell or range reference" spellcheck="false" autocomplete="off">
      <span class="reference-arrow" aria-hidden="true">▾</span>
      <span class="formula-symbol" aria-hidden="true">fx</span>
      <input id="formula-input" class="formula-input" aria-label="Cell contents" readonly autocomplete="off" spellcheck="false">
    </section>
    <main id="grid" class="grid" aria-label="Spreadsheet">
      <button id="select-all" class="grid-corner" title="Select all cells" aria-label="Select all cells"><span></span></button>
      <div id="column-headers" class="column-headers" aria-hidden="true"></div>
      <div id="row-headers" class="row-headers" aria-hidden="true"></div>
      <div id="sheet-scroll" class="sheet-scroll" role="grid" aria-label="Home sheet" tabindex="0" aria-multiselectable="true" aria-rowcount="1000" aria-colcount="52">
        <div id="sheet-surface" class="sheet-surface">
          <div id="cell-layer" class="cell-layer"></div>
          <div id="animation-overlay" class="animation-overlay" aria-hidden="true"></div>
          <div id="range-outline" class="range-outline" aria-hidden="true"></div>
          <div id="active-outline" class="active-outline" aria-hidden="true"><span class="fill-handle"></span></div>
          <textarea id="cell-editor" class="cell-editor" aria-label="Edit cell" rows="1" spellcheck="false" hidden></textarea>
        </div>
      </div>
      <div id="resize-guide" class="resize-guide" hidden aria-hidden="true"></div>
      <div id="resize-label" class="resize-label" hidden aria-hidden="true"></div>
    </main>
    <section id="animation-studio" class="animation-studio" aria-label="Animation studio" hidden></section>
    <footer class="sheet-bar">
      <button class="icon-button" data-action="add-sheet" disabled aria-label="Add sheet" title="Add sheet"></button>
      <button class="icon-button sheet-list-button" data-action="sheet-list" aria-label="All sheets" title="All sheets"></button>
      <div id="sheet-tabs" class="sheet-tabs" role="tablist" aria-label="Workbook sheets"></div>
      <div id="animation-playback-controls" class="animation-playback-controls" aria-label="Animation playback" hidden></div>
      <span id="selection-status" class="selection-status" aria-live="polite"></span>
    </footer>
  </div>
  <div id="popup" class="popup" role="menu" hidden></div>
  <dialog id="workbook-dialog" class="workbook-dialog"></dialog>
  <dialog id="admin-auth-dialog" class="workbook-dialog"></dialog>
  <dialog id="animation-event-dialog" class="workbook-dialog animation-event-dialog"></dialog>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <noscript>This workbook needs JavaScript to edit cells and save changes in your browser.</noscript>
</body>
</html>
